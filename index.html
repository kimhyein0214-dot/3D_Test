<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f0ec">
<title>Pink Rocket · 3D 피어싱 뷰어</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./viewer.css">
<script type="importmap">{"imports":{"three":"./assets/vendor/three/build/three.module.js","three/addons/":"./assets/vendor/three/addons/"}}</script>
</head>
<body>
<main class="app">
<aside class="controls" aria-label="피어싱 착용 설정">
<header class="brand"><span>PINK ROCKET</span><small>3D TRY-ON</small></header>
<section class="control-section">
<h2>01 <span>귀 모델</span></h2>
<div class="ear-list" id="earList"><button class="ear-card active" data-ear="ear-01" aria-pressed="true"><span class="ear-preview">◖</span><span><b>귀 모델 01</b><small>기본 미리보기</small></span></button></div>
</section>
<section class="control-section">
<h2>02 <span>착용 위치</span></h2>
<div class="chips" id="placeList">
<button data-place="lobe" class="active" aria-pressed="true">귓볼</button>
<button data-place="helix" aria-pressed="false">헬릭스</button>
<button data-place="conch" aria-pressed="false">이너컨츠</button>
<button data-place="tragus" aria-pressed="false">트라거스</button>
</div>
</section>
<section class="control-section">
<h2>03 <span>각도 / 보기</span></h2>
<div class="view-actions"><button id="frontView">정면</button><button id="resetView">보기 초기화</button></div>
</section>
<footer class="selection"><span id="productName">듀오 스파크 링</span><span id="selectionText" aria-live="polite">귀 모델 01 · 귓볼</span></footer>
<details class="demo-products"><summary>테스트 피어싱 변경</summary><select id="productSelect" aria-label="테스트 피어싱"><option value="spark">듀오 스파크 링</option><option value="mini">미니 원터치 링</option><option value="cubic">큐빅 링</option><option value="pearl">진주 링</option></select></details>
</aside>
<section class="viewport" id="viewport" aria-label="3D 귀와 피어싱 미리보기">
<canvas id="stage" aria-label="드래그로 회전하고 휠 또는 두 손가락으로 확대하는 3D 뷰어"></canvas>
<div class="viewport-label">PINK ROCKET <span>· TRY-ON</span></div>
<div class="loading" id="loading" role="status">뷰어 준비 중…</div>
<div class="fallback" id="fallback" role="alert" hidden><p id="errorMessage">3D 뷰어를 불러오지 못했습니다.</p><button id="retry">다시 시도</button></div>
<p class="hint">드래그하여 회전 <span>·</span> 휠 / 두 손가락으로 확대</p>
<div class="notice" id="notice" role="status" hidden></div>
</section>
</main>
<script type="module" src="./viewer.js"></script>
<script>window.addEventListener('error',function(e){if(e.target.tagName==='SCRIPT'){document.getElementById('loading').hidden=true;document.getElementById('fallback').hidden=false;document.getElementById('errorMessage').textContent='뷰어 파일을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.'}},true);document.getElementById('retry').onclick=function(){location.reload()};</script>
</body>
</html>
